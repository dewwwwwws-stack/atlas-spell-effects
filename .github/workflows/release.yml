name: Release
# Every change to main:
#   - makes package-lock.json if there isn't one, and commits it (the exact versions the build uses, so anyone can
#     build the same main.js; Obsidian's review checks for it).
# And when package.json's "version" is new, it:
#   1. sets manifest.json's version (and minAppVersion, from versions.json) to match, and commits it,
#   2. builds main.js,
#   3. attests main.js, styles.css and manifest.json (GitHub's build provenance), so anyone can check they came from here,
#   4. makes the GitHub release with that version as its tag, main.js, manifest.json and styles.css attached
#      (as Obsidian needs), and release-notes.md as its description.
# So an update is: upload the changed files, commit. Nothing else.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write      # for the build attestation
  attestations: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A lockfile (the exact versions of what builds it)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lockfile (package-lock.json)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: The version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Version $VERSION is already released: nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bring manifest.json up to date
        if: steps.v.outputs.new == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const v = '${{ steps.v.outputs.version }}';
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const vs = fs.existsSync('versions.json') ? JSON.parse(fs.readFileSync('versions.json', 'utf8')) : {};
            m.version = v;
            if (vs[v]) m.minAppVersion = vs[v];
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          if ! git diff --quiet manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Version ${{ steps.v.outputs.version }}" manifest.json
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build
        if: steps.v.outputs.new == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Attest the build (proves main.js and styles.css were built here, from this repo)
        if: steps.v.outputs.new == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if [ -f release-notes.md ]; then NOTES=(--notes-file release-notes.md); else NOTES=(--generate-notes); fi
          gh release create "$V" main.js manifest.json styles.css --title "$V" --target "$(git rev-parse HEAD)" "${NOTES[@]}"
